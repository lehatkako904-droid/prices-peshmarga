{% extends "base.html" %}
{% block title %}چوونەژوورەوەی بەڕێوەبەر{% endblock %}
{% block content %}

<div class="auth-wrap">
  <div class="card auth-card">
    <h2>داشبۆردی بەڕێوەبەر</h2>
    <p class="muted">تەنها بەڕێوەبەر دەتوانێت بچێتە ژوورەوە بە پاسوردی تایبەت.</p>
    {% if error %}
    <div class="flash flash-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('admin_login') }}">
      <label>ناوی بەڕێوەبەر</label>
      <input type="text" name="username" required autocomplete="username">

      <label>پاسوردی بەڕێوەبەر</label>
      <input type="password" name="password" required autocomplete="current-password">

      <button type="submit" class="btn btn-primary btn-block">چوونە ژوورەوە</button>
    </form>
  </div>
</div>

{% endblock %}
