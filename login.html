{% extends "base.html" %}
{% block title %}چوونەژوورەوەی فرۆشگا{% endblock %}
{% block content %}

<div class="auth-wrap">
  <div class="card auth-card">
    <h2>چوونەژوورەوەی فرۆشگا / کۆمپانیا</h2>
    <p class="muted">بە ژمارەی پەیوەندی و وشەی تێپەڕی هەژمارەکەت بچۆ ژوورەوە.</p>
    {% if error %}
    <div class="flash flash-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="{{ url_for('login') }}">
      <label>ژمارەی پەیوەندی</label>
      <input type="text" name="phone" required autocomplete="username" dir="ltr">

      <label>وشەی تێپەڕ (Password)</label>
      <input type="password" name="password" required autocomplete="current-password">

      <button type="submit" class="btn btn-primary btn-block" style="margin-top:16px;">چوونەژوورەوە</button>
    </form>
    <p class="muted" style="margin-top:12px;">هێشتا هەژمارت نییە؟ <a href="{{ url_for('register') }}">لێرە تۆماربکە</a></p>
  </div>
</div>

{% endblock %}
